{% extends 'base.html' %}
{% block title %}Register | PhishWise{% endblock %}

{% block content %}
<main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 animate-fade-in-up">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">🛡</div>
            <h1 class="text-2xl font-bold text-slate-800">สร้างบัญชีใหม่</h1>
            <p class="text-slate-500">สมัครสมาชิกเพื่อใช้งาน PhishWise</p>
        </div>

        {% if success %}
            <div class="mb-6 p-4 bg-green-50 text-green-700 rounded-xl border border-green-100">ลงทะเบียนสำเร็จ กรุณาเข้าสู่ระบบ</div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="text" required class="w-full p-3 border border-slate-300 rounded-xl" placeholder="ชื่อ-นามสกุล">
            <input type="email" required class="w-full p-3 border border-slate-300 rounded-xl" placeholder="อีเมล">
            <input type="password" required class="w-full p-3 border border-slate-300 rounded-xl" placeholder="รหัสผ่าน">
            <input type="password" required class="w-full p-3 border border-slate-300 rounded-xl" placeholder="ยืนยันรหัสผ่าน">
            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700">ลงทะเบียน</button>
        </form>

        <div class="text-center text-sm mt-6">
            <span class="text-slate-500">มีบัญชีอยู่แล้ว? </span>
            <a href="{% url 'login' %}" class="font-bold text-blue-600 hover:underline">เข้าสู่ระบบ</a>
        </div>
    </div>
</main>
{% endblock %}
