{% extends 'base.html' %}
{% block title %}Knowledge | PhishWise{% endblock %}

{% block content %}
<main class="max-w-6xl mx-auto px-4 py-12 pb-20">
    <div class="text-center mb-12">
        <div class="inline-flex items-center gap-2 bg-blue-50 text-blue-600 px-4 py-2 rounded-full text-sm font-bold mb-4">Knowledge Center</div>
        <h1 class="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">คลังความรู้ไซเบอร์</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for art in articles %}
            <a href="{% url 'knowledge_detail' art.id %}" class="group bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all">
                <div class="aspect-video overflow-hidden"><img src="{{ art.image }}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
                <div class="p-6">
                    <span class="text-xs font-black text-blue-500 uppercase mb-2 block">{{ art.category }}</span>
                    <h3 class="text-xl font-bold text-slate-800 mb-3 group-hover:text-blue-600 transition-colors">{{ art.title }}</h3>
                    <p class="text-slate-500 text-sm line-clamp-2">{{ art.desc }}</p>
                </div>
            </a>
        {% endfor %}
    </div>
</main>
{% endblock %}
